syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

service OrvantaService {
  rpc getCompany(EmptyRequest) returns (OrvantaCompanyResponse);
  rpc createCompany(OrvantaCreateCompanyRequest) returns (OrvantaCompanyResponse);
  rpc deleteCompany(StringRequest) returns (OrvantaCompanyResponse);
  rpc subscribeCompany(EmptyRequest) returns (stream OrvantaCompanyResponse);
  rpc listAgentProfiles(EmptyRequest) returns (OrvantaAgentProfileList);
  rpc upsertAgentProfile(OrvantaAgentProfile) returns (OrvantaAgentProfile);
  rpc deleteAgentProfile(StringRequest) returns (OrvantaCompanyResponse);
  rpc listLibrary(EmptyRequest) returns (OrvantaLibraryList);
  rpc saveCompanyToLibrary(OrvantaSaveLibraryRequest) returns (OrvantaLibraryList);
  rpc loadCompanyFromLibrary(OrvantaLoadLibraryRequest) returns (OrvantaCompanyResponse);
  rpc deleteLibraryCompany(StringRequest) returns (OrvantaLibraryList);
  rpc listInbox(EmptyRequest) returns (OrvantaInboxResponse);
  rpc resolveDecision(OrvantaResolveDecisionRequest) returns (OrvantaResolveDecisionResponse);
  rpc requestDecision(OrvantaRequestDecisionRequest) returns (OrvantaDecisionItem);
  rpc subscribeWarRoom(EmptyRequest) returns (stream OrvantaWarRoomSnapshot);
  rpc subscribeConsoleState(EmptyRequest) returns (stream OrvantaConsoleStateSnapshot);
  rpc sendAgentDirectMessage(OrvantaSendAgentDirectMessageRequest) returns (OrvantaSendAgentDirectMessageResponse);
  rpc getAgentMemory(StringRequest) returns (OrvantaAgentMemoryResponse);
  rpc saveAgentMemory(OrvantaSaveAgentMemoryRequest) returns (OrvantaAgentMemoryResponse);
  rpc deleteAgentMemory(StringRequest) returns (OrvantaAgentMemoryResponse);
  rpc listMemoryProposals(StringRequest) returns (OrvantaMemoryProposalList);
  rpc approveMemoryProposal(OrvantaMemoryProposalActionRequest) returns (OrvantaAgentMemoryResponse);
  rpc rejectMemoryProposal(OrvantaMemoryProposalActionRequest) returns (OrvantaMemoryProposalList);
  rpc pauseCeoSession(OrvantaCeoSessionPauseRequest) returns (OrvantaCeoSessionPauseResponse);
  rpc getCeoSessionPause(OrvantaCeoSessionPauseRequest) returns (OrvantaCeoSessionPauseResponse);
  rpc resumeCeoSession(OrvantaCeoSessionPauseRequest) returns (OrvantaCeoSessionPauseResponse);
  rpc listCeoSessions(EmptyRequest) returns (OrvantaCeoSessionListResponse);
  rpc getCeoSession(OrvantaCeoSessionRequest) returns (OrvantaCeoSessionResponse);
  rpc getParticipantTranscript(OrvantaParticipantTranscriptRequest) returns (OrvantaParticipantTranscriptResponse);
}

message OrvantaCreateCompanyRequest {
  string name = 1;
  string purpose = 2;
}

message OrvantaRosterAgent {
  string id = 1;
  string display_name = 2;
  string role = 3;
  string status = 4;
  optional string reports_to = 5;
  optional int64 agent_numeric_id = 6;
  repeated string legacy_slugs = 8;
}

message OrvantaCompanyResponse {
  string status = 1;
  repeated string errors = 2;
  string id = 3;
  string name = 4;
  string purpose = 5;
  string team_name = 6;
  repeated OrvantaRosterAgent agents = 7;
  string tasks_json = 8;
}

message OrvantaAgentTools {
  repeated string allow = 1;
  repeated string deny = 2;
}

message OrvantaAgentScopePaths {
  repeated string allow = 1;
  repeated string deny_write = 2;
}

message OrvantaAgentProfile {
  string id = 1;
  string display_name = 2;
  string role = 3;
  string description = 4;
  optional string model_id = 5;
  optional int32 max_iterations = 6;
  optional double temperature = 7;
  string instructions = 8;
  string file_path = 9;
  optional int64 agent_numeric_id = 22;
  OrvantaAgentTools tools = 10;
  OrvantaAgentScopePaths scope_paths = 11;
  optional string reports_to = 12;
  optional string reasoning_effort = 13;
  optional bool supports_images = 14;
  optional int32 context_window = 15;
  optional int32 max_output_tokens = 16;
  repeated string rules = 17;
  repeated string skills = 18;
  optional string provider_id = 19;
  optional string auto_approval_json = 20;
  repeated string mcp_servers = 21;
}

message OrvantaAgentProfileList {
  repeated OrvantaAgentProfile profiles = 1;
}

message OrvantaLibraryEntry {
  string slug = 1;
  string name = 2;
  string saved_at = 3;
  int32 agent_count = 4;
  string purpose_preview = 5;
  bool is_broken = 6;
  string error = 7;
}

message OrvantaLibraryList {
  repeated OrvantaLibraryEntry entries = 1;
}

message OrvantaSaveLibraryRequest {
  string name = 1;
  string slug = 2;
  bool overwrite = 3;
}

message OrvantaLoadLibraryRequest {
  string slug = 1;
  bool replace = 2;
}

message OrvantaDecisionItem {
  string id = 1;
  string type = 2;
  string status = 3;
  string created_at = 4;
  string created_by = 5;
  string title = 6;
  string summary = 7;
  string payload_json = 8;
  string urgency = 9;
}

message OrvantaHistoryEntry {
  string id = 1;
  string type = 2;
  string status = 3;
  string resolved_at = 4;
  string resolved_by = 5;
  string note = 6;
  string title = 7;
  string summary = 8;
  string payload_json = 9;
  string urgency = 10;
  string created_at = 11;
  string created_by = 12;
}

message OrvantaInboxResponse {
  repeated OrvantaDecisionItem pending = 1;
  repeated OrvantaDecisionItem deferred = 2;
  repeated OrvantaHistoryEntry history = 3;
  int32 pending_count = 4;
}

message OrvantaResolveDecisionRequest {
  string id = 1;
  string action = 2;
  string note = 3;
}

message OrvantaResolveDecisionResponse {
  bool success = 1;
  string error = 2;
  optional OrvantaHistoryEntry resolved = 3;
  optional OrvantaDecisionItem item = 4;
}

message OrvantaRequestDecisionRequest {
  string type = 1;
  string title = 2;
  string summary = 3;
  string payload_json = 4;
  optional string urgency = 5;
}

// War Room messages

message OrvantaCardBufferLine {
  // kind: "text" | "tool_start" | "tool_result" | "deny" | "progress" | "error" | "think"
  string kind = 1;
  string text = 2;
}

message OrvantaAgentCard {
  string id = 1;
  string display_name = 2;
  string role = 3;
  // status: idle | queued | running | completed | failed | cancelled | interrupted | stopped
  string status = 4;
  // task title currently assigned
  string task_title = 5;
  // elapsed seconds if running (0 otherwise)
  int64 elapsed_seconds = 6;
  // ring buffer of last 20 activity lines
  repeated OrvantaCardBufferLine buffer = 7;
  // true for ephemeral/guest agents
  bool is_ephemeral = 8;
  int64 input_tokens = 9;
  int64 output_tokens = 10;
  double cost = 11;
}

message OrvantaWarRoomSnapshot {
  repeated OrvantaAgentCard cards = 1;
  string company_name = 2;
  string purpose_one_liner = 3;
  // live | stale | reconnecting
  string sync_status = 4;
  // ISO timestamp of last authoritative snapshot emit
  string last_updated_at = 5;
}

// Console & Channels messages (v0.0.4)

message OrvantaChannelItem {
  string id = 1;             // "team-feed" hoặc agentId (vd: "implementer")
  string name = 2;           // "#team-feed" hoặc "Dave"
  string role = 3;           // "channel" | "lead" | "implementer" | "reviewer"...
  string status = 4;         // "idle" | "running" | "failed" | "completed"
  bool is_channel = 5;       // true nếu là #team-feed
  bool is_ephemeral = 6;     // true nếu là agent tạm thời
  int32 unread_count = 7;    // số lượng sự kiện chưa đọc
  int64 running_elapsed = 8; // số giây đã chạy nếu running
  string current_task = 9;   // tiêu đề task đang thực hiện
}

message OrvantaConsoleStateSnapshot {
  string active_channel_id = 1;
  repeated OrvantaChannelItem channels = 2;
  bool is_sidebar_collapsed = 3;
}

message OrvantaSendAgentDirectMessageRequest {
  string agent_id = 1;
  string message = 2;
  optional string subject = 3;
}

message OrvantaSendAgentDirectMessageResponse {
  bool success = 1;
  optional string error = 2;
}

message OrvantaAgentMemoryResponse {
  bool success = 1;
  optional string error = 2;
  string agent_id = 3;
  string content = 4;
  // empty | ready | missing | corrupt
  string status = 5;
}

message OrvantaSaveAgentMemoryRequest {
  string agent_id = 1;
  string content = 2;
}

message OrvantaMemoryProposal {
  string id = 1;
  string agent_id = 2;
  string content = 3;
  string created_at = 4;
}

message OrvantaMemoryProposalList {
  bool success = 1;
  optional string error = 2;
  string agent_id = 3;
  repeated OrvantaMemoryProposal proposals = 4;
}

message OrvantaMemoryProposalActionRequest {
  string agent_id = 1;
  string proposal_id = 2;
}

message OrvantaCeoSessionPauseRequest {
  string session_id = 1;
}

message OrvantaCeoSessionPauseResponse {
  bool success = 1;
  optional string error = 2;
  string session_id = 3;
  // none | pause_requested | paused | partial
  string status = 4;
  string participants_json = 5;
  // JSON array of { agentId, reason, at } for unclear side effects
  string needs_attention_json = 6;
}

message OrvantaCeoSessionRequest {
  string session_id = 1;
}

message OrvantaCeoSessionParticipant {
  int64 agent_numeric_id = 1;
  string agent_slug = 2;
  string display_name = 3;
  string role = 4;
  string task_id = 5;
  optional string sdk_session_id = 6;
  repeated string run_ids = 7;
  string status = 8;
}

message OrvantaCeoSessionIndexItem {
  string session_id = 1;
  string company_id = 2;
  string title = 3;
  string created_at = 4;
  string updated_at = 5;
  string status = 6;
  bool is_favorited = 7;
  repeated OrvantaCeoSessionParticipant participants = 8;
}

message OrvantaCeoSessionListResponse {
  bool success = 1;
  optional string error = 2;
  // none | ready | missing_index | corrupt | workspace_mismatch
  string status = 3;
  repeated OrvantaCeoSessionIndexItem sessions = 4;
}

message OrvantaCeoSessionResponse {
  bool success = 1;
  optional string error = 2;
  // none | ready | not_found | corrupt | workspace_mismatch
  string status = 3;
  optional OrvantaCeoSessionIndexItem session = 4;
  string manifest_json = 5;
}

message OrvantaParticipantTranscriptRequest {
  string session_id = 1;
  optional int64 participant_numeric_id = 2;
  optional string run_id = 3;
  optional string cursor = 4;
  optional int32 page_size = 5;
}

message OrvantaParticipantTranscriptResponse {
  bool success = 1;
  optional string error = 2;
  // ok | not_linked | not_found | error
  string status = 3;
  optional string code = 4;
  optional string sdk_session_id = 5;
  optional int64 participant_numeric_id = 6;
  optional string participant_slug = 7;
  repeated string run_ids = 8;
  string messages_json = 9;
  optional string next_cursor = 10;
  bool truncated = 11;
}


